pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        mavenLocal()
    }
}
plugins {
    // JDK 25 toolchain (needed by the 26.1+ leaves)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
}

rootProject.name = 'VisorPlugin'
include 'visor-api'
include 'visor-core'
include "versions:nms-v1_20_R1"
include "versions:nms-v1_21_1"
include "versions:nms-v1_21_3"
include "versions:nms-v1_21_4"
include "versions:nms-v1_21_5"
include "versions:nms-v1_21_6"
include "versions:nms-v1_21_7"
include "versions:nms-v1_21_8"
include "versions:nms-v1_21_9"
include "versions:nms-v1_21_10"
include "versions:nms-v1_21_11"
include "versions:nms-v26_1"
include "versions:nms-v26_2"

